<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Spell Tech Redirect</title>
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var locationInfo = window.location;

      locationInfo.replace(
        locationInfo.protocol + '//' + locationInfo.hostname + (locationInfo.port ? ':' + locationInfo.port : '') +
        locationInfo.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        locationInfo.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (locationInfo.search ? '&q=' + locationInfo.search.slice(1).replace(/&/g, '~and~') : '') +
        locationInfo.hash
      );
    </script>
  </head>
  <body></body>
</html>
