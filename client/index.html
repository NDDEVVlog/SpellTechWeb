<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell Tech Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const redirectParams = new URLSearchParams(window.location.search);
      const redirectedPath = redirectParams.get('p');

      if (redirectedPath) {
        const redirectedQuery = redirectParams.get('q');
        const restoredUrl = redirectedPath +
          (redirectedQuery ? `?${redirectedQuery.replace(/~and~/g, '&')}` : '') +
          window.location.hash;
        window.history.replaceState(null, '', restoredUrl);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
